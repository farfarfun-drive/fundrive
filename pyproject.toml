[project]
name = "fundrive"
version = "2.0.91"
description = "统一的网盘/云存储操作接口框架 - 一套 API 打通 20+ 服务，涵盖 Google Drive、OneDrive、S3、百度网盘、阿里云盘、蓝奏云、WebDAV 等"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "orjson>=3.10.10",
 "requests>=2.32.4",
 "tqdm>=4.67.1",
 "urllib3>=2.0",
 "funsecret>=1.4.96",
 "farlog>=1.1.8",
 "funget>=1.1.69",
]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[dependency-groups]
dev = [ "pytest>=8.0", "ruff>=0.6",]
all = [ "fundrive[oss]", "fundrive[alipan]", "fundrive[webdav]", "fundrive[baidu]", "fundrive[lanzou]", "fundrive[google]", "fundrive[onedrive]", "fundrive[wenshushu]", "fundrive[amazon]", "fundrive[tsinghua]", "fundrive[dropbox]", "fundrive[github]", "fundrive[gitee]", "fundrive[ossutil]", "fundrive[pan115]",]

[project.optional-dependencies]
# `all` 是自引用 extra（PEP 621 允许），让 `uv add "fundrive[all]"` 能一次装齐全部驱动；
# 上面 [dependency-groups] 的同名组只对本仓库开发者生效，发布到 PyPI 的元数据里没有它。
all = [ "fundrive[oss]", "fundrive[alipan]", "fundrive[webdav]", "fundrive[baidu]", "fundrive[lanzou]", "fundrive[google]", "fundrive[onedrive]", "fundrive[wenshushu]", "fundrive[amazon]", "fundrive[tsinghua]", "fundrive[dropbox]", "fundrive[github]", "fundrive[gitee]", "fundrive[ossutil]", "fundrive[pan115]",]
alipan = [ "aligo>=6.2.4", "fundrive-alipan>=1.3.13",]
oss = [ "oss2>=2.19.0",]
webdav = [ "webdav4>=0.10.0",]
wenshushu = [ "base58>=2.1.1", "pycryptodomex>=3.21.0",]
baidu = [ "fundrive-baidu>=1.0.10",]
lanzou = [ "fundrive-lanzou>=1.2.73", "funfile>=1.0.39",]
dropbox = [ "dropbox>=12.0.2",]
google = [ "google-api-python-client>=2.0.0", "google-auth>=2.0.0", "google-auth-httplib2>=0.1.0", "google-auth-oauthlib>=1.0.0",]
amazon = [ "boto3>=1.34.0", "botocore>=1.34.0",]
ossutil = [ "funinstall>=1.0.58",]
pan115 = [ "p115client>=0.0.9.6.5.1", "funfile>=1.0.39",]
pcloud = []
github = []
gitee = []
onedrive = []
tsinghua = []
mediafire = []
zenodo = []
openxlab = []
tianchi = []

[project.urls]
Organization = "https://github.com/farfarfun-drive"
Repository = "https://github.com/farfarfun-drive/fundrive"
Releases = "https://github.com/farfarfun-drive/fundrive/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundrive"]

[tool.ruff]
src = [ "src", "tests",]
target-version = "py312"
extend-exclude = [ "*.md",]

# ---------------------------------------------------------------------------
# 以下 select / ignore 是 fundrive 工作区五个仓库**共用的基线**，逐字相同。
# 改动任何一条都要同步到另外四个仓库（fundrive / fundrive-alipan / fundrive-baidu /
# fundrive-lanzou / fundrive-quark），否则"统一"立刻又散掉。
# 基线的取舍记录在 fundrive-dev 的 docs/project/project-governance/
# 004-known-deviations.md 第 6 条。
# ---------------------------------------------------------------------------
[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle 里真正是错误的那部分
    "F",               # pyflakes
    "I",               # import 排序
    "UP",              # 过时写法
    "B",               # bugbear
    "SIM",             # 可简化的写法
    "RET",             # return 路径
    "C4",              # 推导式与字面量
    "PLE",             # pylint 的 error 级
    "T100",            # 漏在代码里的 breakpoint()
    "S102",            # exec()
]
ignore = [
    # 行宽交给 `ruff format`：中文文案按字符计数很容易超 88，强行折行更难读，
    # 格式化器也无法拆单个字符串字面量。
    "E501",
    # farlog（基于 loguru）的日志调用用 `{}` 占位符传参，不是 stdlib logging 的
    # `%s` 语法；ruff 把 logger 调用当成 stdlib logging 处理，误判为参数过多。
    "PLE1205",
]
# 基线**没有**开 BLE 与 DTZ，原因不是忘了：
#   BLE001（blind-except）—— `fundrive` 核心库有 363 处 `except Exception`。包装 25 个云服务 API
#     时"任何异常都转成返回值"是它的错误处理架构，不是疏忽；逐个收窄是重新设计错误模型，
#     不是 lint 能顺手做的事。
#   DTZ（naive datetime）—— 全工作区 9 处，改成 tz-aware 会改变对用户显示的时间，
#     属于行为变更，要连同"该显示本地时间还是 UTC"一起决定。
# 哪个仓库目前已经干净，可以自己 extend-select 加严（fundrive-quark 就是这么做的）。

[tool.pytest.ini_options]
testpaths = [ "tests",]
pythonpath = [ "src",]
addopts = "-q --strict-markers"

[tool.ruff.lint.per-file-ignores]
"src/fundrive/drives/*/example.py" = [ "T201",]
