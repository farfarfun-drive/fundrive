name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Sync dependencies
        # 刻意只装核心依赖 + dev 组，不装任何可选 SDK（不传 --extra）：
        # 测试必须能在裸环境下抓出驱动注册表的类名拼写错误。
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Test
        # 没收集到用例时 pytest 返回 5，CI 会失败，避免"空跑的绿灯"
        run: uv run pytest -v

      - name: Import smoke test (bare env, read-only-ish cwd)
        run: |
          PY="$PWD/.venv/bin/python"
          cd "$(mktemp -d)"
          "$PY" -c "
          import fundrive
          n = len(fundrive.get_supported_drives())
          assert n >= 25, f'注册表只剩 {n} 个驱动，可能有 spec 被漏掉'
          print(f'OK: {n} 个驱动已注册, 本机可用 {len(fundrive.list_available_drives())} 个')
          "

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Build wheel & sdist
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test-floor:
    # 在 requires-python 声明的**下界**上再跑一遍测试。上面的 test job 用的是 uv 自己选的
    # Python（当前会选到 3.14），所以"支持 3.12"这个声明此前从未被实际验证过。
    #
    # 这里的版本号必须与 pyproject.toml 的 requires-python 下界一致。谁抬了下界却忘了改这里，
    # uv sync 会因为解释器不满足 requires-python 直接失败 —— 而不是静默继续测一个
    # 已经不再支持的版本。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Test
        run: uv run pytest -q
